name: Daily Live Run

# 평일 미국장 마감 후 ET 17:50 에 자동 실행 (KST 익일 07:50)
# 설계서 12장
on:
  schedule:
    - cron: "50 17 * * 1-5"
  # 테스트 코드 (#4~#9 수동 테스트용 trade_date 입력 지원):
  # 기존은 입력값 없는 빈 dispatch 였다 — 아래 주석 참고.
  #   workflow_dispatch: {}
  workflow_dispatch:
    inputs:
      trade_date:
        description: "YYYY-MM-DD 형식의 과거 재현 날짜 (휴장일 / 주말 포함). 비워두면 오늘."
        required: false
        type: string
        default: ""

env:
  TZ: America/New_York
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "1.8.3"

jobs:
  run-daily:
    name: live.cli run-daily
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QBT (this repo)
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies (live extras)
        run: poetry install -E live --no-root --no-interaction

      - name: Install live package
        run: poetry install -E live --no-interaction

      - name: Write Firebase service account
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          mkdir -p secrets
          echo "$FIREBASE_CONFIG" > secrets/firebase_admin.json

      - name: Run live.cli run-daily (1차 시도)
        id: run_first
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/secrets/firebase_admin.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_REPO_PAT: ${{ secrets.STATE_REPO_PAT }}
          # 테스트 코드 (수동 trade_date 입력 지원): cron 실행 시 빈 값, dispatch 시만 값 존재
          TRADE_DATE: ${{ github.event.inputs.trade_date }}
        continue-on-error: true
        # 테스트 코드 (수동 trade_date 입력 지원):
        # 기존은 아래 한 줄이었다 — 아래 주석 참고.
        #   run: poetry run python -m live run-daily
        run: |
          if [ -n "$TRADE_DATE" ]; then
            poetry run python -m live run-daily --trade-date "$TRADE_DATE"
          else
            poetry run python -m live run-daily
          fi

      - name: Wait 5 minutes before retry
        if: steps.run_first.outcome == 'failure'
        run: sleep 300

      - name: Run live.cli run-daily (2차 재시도)
        id: run_retry
        if: steps.run_first.outcome == 'failure'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/secrets/firebase_admin.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_REPO_PAT: ${{ secrets.STATE_REPO_PAT }}
          # 테스트 코드 (수동 trade_date 입력 지원):
          TRADE_DATE: ${{ github.event.inputs.trade_date }}
        # 테스트 코드 (수동 trade_date 입력 지원):
        # 기존은 아래 한 줄이었다 — 아래 주석 참고.
        #   run: poetry run python -m live run-daily
        run: |
          if [ -n "$TRADE_DATE" ]; then
            poetry run python -m live run-daily --trade-date "$TRADE_DATE"
          else
            poetry run python -m live run-daily
          fi

  notify-failure:
    name: Notify failure (FCM + Telegram)
    needs: run-daily
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout QBT
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.3

      - name: Install dependencies
        run: poetry install -E live --no-interaction

      - name: Write Firebase service account
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          mkdir -p secrets
          echo "$FIREBASE_CONFIG" > secrets/firebase_admin.json

      - name: Send failure notification
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/secrets/firebase_admin.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: poetry run python -m live notify-failure
