[pytest]
# pytest 설정 파일
# 이 파일은 pytest 실행 시 자동으로 로드되어 기본 동작을 설정합니다.

# 테스트 파일 검색 경로
testpaths = tests

# 테스트 파일 패턴
python_files = test_*.py

# 테스트 클래스 패턴 (Test로 시작)
python_classes = Test*

# 테스트 함수 패턴 (test_로 시작)
python_functions = test_*

# 최소 pytest 버전 요구사항
minversion = 9.0

# 경고 표시 옵션
# error: 경고를 에러로 처리 (엄격 모드)
# ignore: 특정 경고 무시
# default: 기본 경고 표시
filterwarnings =
    # pandas FutureWarning 무시 (외부 라이브러리 경고)
    ignore::FutureWarning:pandas
    # DeprecationWarning 표시 (경고는 확인)
    default::DeprecationWarning
    # 수치 경고(0 나누기 · 오버플로 · 무효 연산)는 테스트 실패 — NaN · inf 가 섞인 계산의 통과 차단
    # (병렬 워커 프로세스에는 tests/qbt/conftest.py 가 환경 변수 PYTHONWARNINGS 로 같은 필터 전달)
    error::RuntimeWarning

# 출력 옵션
# -v: verbose (상세 출력)
# -ra: 모든 테스트 결과 요약 표시
# --tb=short: traceback을 짧게 표시
# --strict-markers: 등록되지 않은 마커 사용 시 에러
addopts =
    -ra
    --strict-markers
    --tb=short


# 로그 설정
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
