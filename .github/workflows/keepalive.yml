name: Keepalive

# cron "0 1 1 * *" 로 매월 UTC 1일 01:00 (= KST 1일 10:00) 에 quant (퍼블릭) 리포에
# 빈 commit 을 남긴다. GitHub Actions 는 퍼블릭 리포에서 60일간 activity (commit /
# PR / issue) 가 없으면 scheduled workflow 를 자동 정지하며, workflow run 은
# activity 로 카운트되지 않는다. 이 월 1회 빈 commit 으로 daily_run.yml 의 cron
# 스케줄이 비활성화되지 않도록 유지한다.

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    name: Empty commit on quant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # 기본 GITHUB_TOKEN 에 push 권한 부여 (같은 리포이므로 PAT 불필요)
      contents: write
    steps:
      - name: Checkout QBT (this repo)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Create empty keepalive commit
        run: |
          git config user.name "qbt-live-bot"
          git config user.email "qbt-live-bot@noreply.github.com"
          git commit --allow-empty -m "keepalive: $(date -u +%Y-%m-%d)"
          git push
